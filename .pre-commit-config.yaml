repos:
  - repo: local
    hooks:  # On macOS, pixi-installed tools (pytest, ruff, mypy) can fail due to shebang path resolution issues. Using python -m <tool> bypasses this reliably.
      - id: ruff
        name: ruff
        entry: pixi run python -m ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff-format
        entry: pixi run python -m ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: pixi run python -m mypy .
        language: system
        types: [python]
        pass_filenames: false

      # Built-in pygrep — no remote pre-commit-hooks dep, no network.
      # Real conflict markers: `<<<<<<< <ref>` and `>>>>>>> <ref>` (with
      # trailing space) and `=======` *alone on a line*. The bare-`=======`
      # form would otherwise false-positive on pytest's `======== … ========`
      # header lines (>7 equals followed by text), so we anchor it $.
      - id: check-merge-conflict
        name: check-merge-conflict
        entry: '^(<<<<<<< |>>>>>>> |={7}$)'
        language: pygrep

      # Local reimplementation of pre-commit-hooks' check-added-large-files.
      # The limit is raised from the upstream default (maxkb=500) to 2000 KB
      # because pixi.lock is 645 KB and is legitimately large; every task that
      # adds a dependency rewrites and stages it. Excluding the lock file
      # instead would drop the check on the one file most likely to grow.
      # System bash + wc only; bash's arithmetic context strips BSD-wc's
      # leading whitespace so no tr needed.
      - id: check-added-large-files
        name: check-added-large-files (limit 2000 KB)
        entry: 'bash -c ''max=2000000; rc=0; for f in "$@"; do sz=$(wc -c < "$f"); if (( sz > max )); then echo "$f: $sz bytes exceeds limit of $max" >&2; rc=1; fi; done; exit $rc'' --'
        language: system

      # Refuse to CREATE a commit the push credential cannot PUBLISH. GitHub
      # rejects any push touching .github/workflows/ unless the token carries
      # the `workflow` scope, and that refusal arrives from the post-commit
      # hook -- after the commit exists and after the sweep that validated it.
      # 2026-10-03: an OAuth token minted without `workflow` had pushed every
      # commit for months because none touched .github/; the first that did
      # sat unpublished for a day. The script compares the index against
      # origin/main (not HEAD), so it also fires when an EARLIER unpushed
      # commit carries the change -- stacking behind an unpushable commit only
      # makes the stack unpushable. `pass_filenames: false` and
      # `always_run: true`: it reads the index itself, so `--all-files` does
      # not make it fire on a workflow file that is merely present and pushed.
      - id: check-push-scope
        name: check-push-scope (workflow files need a token with `workflow`)
        entry: bash scripts/check_push_scope.sh
        language: system
        pass_filenames: false
        always_run: true

      # Local reimplementation of pre-commit-hooks' check-toml. tomllib is
      # stdlib in 3.11+; this template requires 3.12+. Routed through
      # `pixi run python` so the env (and its Python) is the same one the
      # other hooks use.
      - id: check-toml
        name: check-toml
        entry: 'pixi run python -c ''import sys,tomllib;[tomllib.load(open(f,"rb")) for f in sys.argv[1:]]'''
        language: system
        types: [toml]
