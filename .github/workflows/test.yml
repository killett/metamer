name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install ruff
        run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux only, every supported minor. The floor is 3.12 because
        # core/registry.py uses PEP 695 generics.
        #
        # macOS and Windows were tried and removed. What failed there was not the
        # library: it was tests/test_memory.py's RSS assertions, which are
        # OS-specific by nature, and a hard-coded threads=4 against a 3-core macOS
        # runner. Supporting those platforms means deciding what RSS accounting
        # should mean on each of them, which is a real piece of work and not a CI
        # setting. Until then the classifiers claim no operating system, so nothing
        # here overstates what is supported.
        os: [ubuntu-latest]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      # Both extras, and [batch] is not optional here despite its name. The smoke
      # test below runs `python -m metamer`, and `__main__.py` imports
      # `metamer.batch.run` unconditionally, which imports zarr; most of the test
      # suite imports xarray, zarr or pydantic for the same reason. Installing
      # only [test] left every matrix job dying at the smoke step with
      # `ModuleNotFoundError: No module named 'zarr'` -- before pytest ever ran.
      #
      # This does NOT weaken the core-without-batch contract. That contract is
      # held by tests/test_core_isolation.py, which probes a SUBPROCESS's
      # sys.modules after importing metamer.core, so it measures the import graph
      # rather than what happens to be installed; and by tests/test_packaging.py,
      # which builds its own venv and installs the wheel with --no-deps.
      - name: Install the package with its test and batch extras
        run: pip install ".[test,batch]"
      # pytest is configured with pythonpath = ["src"], so the suite below runs
      # against the working tree rather than the installed distribution. This step
      # is what actually exercises the installed package: it runs from outside the
      # repository, where src/ is not importable.
      - name: Smoke-test the installed package
        working-directory: ${{ runner.temp }}
        run: |
          python -c "import metamer; print(metamer.__version__)"
          # `--version`, NOT a bare `python -m metamer`. A bare invocation is a
          # usage error -- `config` and `store` are required positionals -- and
          # `_Parser.error` maps that to exit 3 (CONFIG_INVALID), which under
          # `bash -e` fails the step. It still exercises the same import graph:
          # `__main__`'s imports of `metamer.batch.*` run before argparse sees
          # any flag, so this is what catches a batch-layer import that the
          # published wheel cannot satisfy.
          python -m metamer --version
      # `slow` stays IN: those tests drive the real Kalman filter at production
      # sizes and are the only thing that exercises the batched driver on anything
      # but healthy series, so deselecting them would make a green run meaningless.
      #
      # `machine` is deselected, and that is a real gap rather than a tidy-up. Those
      # tests assert on host memory bandwidth, RSS watermarks and wall-clock rates;
      # on shared CI runners the bandwidth ratio came out 1.97 against a > 2.0 bound
      # while two identically-specified runners passed the same assertion. Keeping
      # them here would buy a flaky signal, not a stronger one. They are covered by
      # `pixi run test` on a known machine, and a green run of this workflow does
      # not certify them.
      - name: Run the test suite
        run: pytest -m "not machine"
