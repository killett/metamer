[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "metamer"
dynamic = ["version"]  # Derived from the git tag by hatch-vcs; see [tool.hatch.version] below.
description = "Fit stochastic noise models to time series and select among them by information criteria."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Emmy Killett", email = "57272627+killett@users.noreply.github.com" }]
# Floor only, deliberately no upper cap: caps on requires-python are unresolvable
# by downstream consumers and become debt the moment a new Python ships. The
# floor is 3.12 because core/registry.py uses PEP 695 generics (`class Registry[T]`);
# vermin agrees on 3.12, and numpy/scipy both require >=3.12 in any case.
requires-python = ">=3.12"
# Floors are the versions this package has actually been tested against, not the
# oldest that might plausibly work. An untested lower bound is an unbacked claim.
# Note numba pins numpy<2.5 itself, so it -- not this file -- is what caps numpy.
dependencies = [
    "numpy>=2.4",
    "scipy>=1.18",
    "numba>=0.66",
    "psutil>=7.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    # No Operating System classifier. The package is pure Python and has no
    # platform-specific code, but CI tests Linux only, and a classifier is a
    # claim about what is supported rather than about what is likely to work.
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]

[project.optional-dependencies]
# celerite2 is an ORACLE, not a runtime dependency: tests/test_celerite2_agreement.py
# is its only importer, and it is there to check our Matern nu=1/2 likelihood against
# an independent implementation. Nothing under src/ imports it.
test = [
    "pytest>=9",
    "celerite2>=0.3",
]
# The batch layer -- metamer.batch and metamer.config -- and nothing else. These
# are deliberately NOT in [project.dependencies]: metamer.core must stay usable
# for a consumer who wants the likelihood spine and not the store, and
# tests/test_core_isolation.py is what holds that line.
#
# THIS EXTRA IS WHY THE EXTRA EXISTS AT ALL. That isolation test was written in
# Phase 1 and its docstring already referred to "the [batch] extra", which did
# not exist -- so the packaging contract it describes was enforced by nothing.
# `pixi run` executes off PYTHONPATH=src inside a complete environment, so an
# import that would break the published wheel is invisible in development and
# surfaces only for someone who ran `pip install metamer[batch]`.
#
# zarr's floor is a MAJOR-version claim, not a tested-against one: the v2 and v3
# on-disk layouts are different formats and the store schema needs v3 sharding.
batch = [
    "xarray>=2026.7",
    "zarr>=3,<4",
    "pydantic>=2.13",
    "threadpoolctl>=3.6",
    # cftime is a runtime dependency of the batch layer that nothing under src/
    # imports: xarray reaches for it to decode any non-standard calendar, and
    # `noleap` and `360_day` are ordinary climate-model calendars. Without it a
    # store on either simply fails to decode.
    #
    # NOTE WHAT THIS MEANS FOR tests/test_packaging.py: its requirement check
    # scans src/ for imports, so a dependency used only THROUGH another library
    # is invisible to it. That check guards "imported but undeclared"; this entry
    # is a case it cannot reach, and it is declared by hand for that reason.
    "cftime>=1.6",
]

[project.urls]
Homepage = "https://github.com/killett/metamer"
Repository = "https://github.com/killett/metamer"
Issues = "https://github.com/killett/metamer/issues"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
# Generated at build time, gitignored. src/metamer/__init__.py imports it with a
# fallback so the uninstalled PYTHONPATH=src flow that pixi uses still works.
version-file = "src/metamer/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/metamer"]

[tool.hatch.build.targets.sdist]
# The sdist is what conda-forge and anyone doing `pip install --no-binary` builds
# from. It carries the package and its tests; the design documents, the benchmark
# result JSONs, and the environment directories are repository material, not
# distribution material.
exclude = [
    # docs/superpowers/notes is deliberately NOT excluded: tests/test_gradients.py
    # reads complex-step-verdict.md, so dropping it would ship a test suite whose
    # fixtures are missing and which therefore cannot pass from an unpacked sdist.
    # The plans and specs have no such tie and are the bulk of the directory.
    "/docs/superpowers/plans",
    "/docs/superpowers/specs",
    "/bench",
    "/docs/phase1-prompt.md",
    "/.pixi",
    "/.superpowers",
    "/.claude",
    "/pixi.lock",
    "/CLAUDE.md",
    "/PROGRESS.md",
    "/.scaffold.lock",
    "/.sandbox_settings.json",
]

[tool.ruff]
# ruff 0.16 formats Python code fences inside markdown when it walks a directory, so a bare
# `ruff format .` at the repo root rewrites docs/superpowers/plans/*.md. Those fences are the
# specification: they are extracted verbatim into per-task briefs and transcribed into code,
# so reformatting them silently changes what gets implemented. Verified on a copy — the plan
# document came back "1 file reformatted". The pre-commit hooks are already safe because they
# are `types: [python]`-filtered; this closes the direct-invocation path.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "F",      # Pyflakes — unused imports, undefined names, etc.
    "E",      # pycodestyle errors (subset — see ignores below)
    "W",      # pycodestyle warnings
    "B",      # flake8-bugbear
    "B9",     # bugbear opinionated rules
    "UP",     # pyupgrade — modernize syntax to latest Python
    "I",      # isort — import ordering
    "ANN",    # flake8-annotations — enforce type hints
    "D",      # enable the pydocstyle rules
    "S",      # bandit — security linter (subset — see ignores below)
]
ignore = [
    "E501",   # line too long (handled by ruff format)
    "D100",   # missing docstring in public module
    "D104",   # missing docstring in public package (__init__.py)
    "ANN204", # missing return type annotation for __init__
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "D", "S"]  # Otherwise Claude would either over-annotate every test or fight ruff constantly.

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"

# scipy ships no type stubs. Task 4 needed a per-file `# type: ignore[import-untyped]` in
# tests/oracles.py, and Task 5 brings scipy into src/ (statespace.py's expm fallback), so
# without this the ignores multiply across the package. Declared centrally instead, which
# is the pattern this file already anticipated for rasterio/netCDF4 below. Revisit if
# scipy-stubs becomes worth the dependency: real stubs would catch misuse that this hides.
[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true

# src/metamer/_version.py is generated by hatch-vcs at build time and is gitignored,
# so it is absent from a working tree. __init__.py imports it inside a try/except
# ImportError for exactly that reason; without this override mypy would fail on a
# module whose absence is by design.
# cftime ships no type stubs. tests/test_input.py imports it directly to build
# non-standard-calendar fixtures, which is the only way to construct a `noleap`
# or `360_day` axis. Declared centrally, same pattern as scipy above.
[[tool.mypy.overrides]]
module = ["cftime.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["metamer._version"]
ignore_missing_imports = true

# Uncomment when using rasterio or netCDF4:
# [[tool.mypy.overrides]]
# module = ["rasterio.*", "netCDF4.*"]
# ignore_missing_imports = true

[[tool.mypy.overrides]]  # Tests often have untyped functions and use dynamic features, so relax mypy rules for them.
module = ["tests.*"]
strict = false
warn_return_any = false
# Claude Opus 4.7 says: the test override has strict = false but that doesn't disable specific checks already enabled globally. So we also need to disable these individually:
disallow_untyped_defs = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
addopts = "-v"
# `slow` marks tests that drive the REAL Kalman filter at production sizes:
# tests/test_fit.py (five-series batches through the whole driver) and the
# N=5000 gradient step-rule case. They are the reason the suite runs in ~255 s
# rather than ~2 s, and they are NOT optional -- exit criterion 9 requires the
# three widely separated N, and the standing batched-equals-solo invariant is
# meaningless on a batch of healthy series.
#
#   pixi run test          -- the FULL sweep. This is what CI and every
#                             end-of-task verification must run.
#   pixi run test-fast     -- deselects `slow` for rapid iteration only.
#                             A green fast run is NOT evidence a task is done.
markers = [
    "slow: drives the real filter at production sizes; deselected only by test-fast",
    # `machine` marks tests whose assertions are about the HOST, not about metamer:
    # memory bandwidth, RSS watermarks, wall-clock rates, available core counts.
    # They are real tests and they must keep running on a known machine -- they are
    # what pins the units of the RSS shim and the per-core bandwidth claim the whole
    # memory budget rests on. What they cannot do is run on an arbitrary CI runner:
    # observed on GitHub Actions, the bandwidth ratio came out 1.97 against a > 2.0
    # bound on one runner while two identically-specified runners passed, and the
    # macOS runner has 3 cores against the hard-coded threads=4. A green CI run
    # therefore does NOT cover these; `pixi run test` locally does.
    "machine: asserts on host memory bandwidth, RSS or timing; not portable to CI runners",
]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src"]

# pixi is used for package management, but if you switch to using uv, it's a good idea to uncomment these lines for security.
# [tool.uv]
# exclude-newer = "7 days"
